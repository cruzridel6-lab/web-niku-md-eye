<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKU MD · Comentarios</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a16;--panel:rgba(16,20,42,.9);--green:#63f5d1;--muted:#9aa8cc;--border:rgba(130,155,255,.28);--danger:#ff7195;--amber:#ffc875}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 50% 0,#102d2e 0,transparent 48%),var(--bg);color:#edf2ff;font-family:'JetBrains Mono',monospace;padding:28px 16px 50px}.wrap{width:min(820px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{color:var(--green);font-family:'Share Tech Mono',monospace;font-size:1.05rem}.back{color:var(--muted);text-decoration:none;font-size:.75rem;border:1px solid var(--border);border-radius:9px;padding:9px 12px}.back:hover{color:var(--green);border-color:var(--green)}.hero{padding:28px;border:1px solid var(--border);border-radius:18px;background:var(--panel);box-shadow:0 20px 70px rgba(0,0,0,.28);margin-bottom:18px}.eyebrow{color:var(--muted);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.hero h1{color:var(--green);font-family:'Share Tech Mono',monospace;font-size:clamp(1.6rem,5vw,2.5rem);margin-bottom:10px}.hero p{color:var(--muted);font-size:.8rem;line-height:1.7}.card{padding:24px;border:1px solid var(--border);border-radius:18px;background:var(--panel);margin-bottom:18px}.form{display:grid;grid-template-columns:190px 1fr auto;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:7px}.field label{color:var(--muted);font-size:.7rem}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;background:rgba(0,0,0,.25);color:#edf2ff;font:inherit;font-size:.8rem;padding:12px;outline:none}.field textarea{min-height:46px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(99,245,209,.1)}button{border:0;border-radius:9px;background:var(--green);color:#03120e;font:700 .75rem 'JetBrains Mono',monospace;padding:13px 16px;cursor:pointer;white-space:nowrap}button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:20px;margin-top:12px;color:var(--amber);font-size:.72rem}.comments{display:grid;gap:11px}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;font-size:.78rem}.comment{display:flex;gap:13px;align-items:flex-start;padding:16px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025)}.avatar{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:11px;background:rgba(99,245,209,.1);color:var(--green);font-weight:800}.body{min-width:0;flex:1}.meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px}.meta strong{font-size:.8rem}.meta time{color:var(--muted);font-size:.66rem;white-space:nowrap}.body p{color:#dce4fa;font-size:.78rem;line-height:1.6;overflow-wrap:anywhere}@media(max-width:650px){.form{grid-template-columns:1fr}.form button{width:100%}.top{align-items:flex-start}.hero,.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">$_ ɴɪᴋᴜMDꫂꤪꤨᴼᶠᶜ</div><a class="back" href="/"><i class="fas fa-arrow-left"></i> Volver al panel</a></div>
  <section class="hero"><div class="eyebrow">./comunidad · página independiente</div><h1>Comentarios de la comunidad</h1><p>Comparte tu experiencia con NIKU MD. Los comentarios se actualizan en tiempo real.</p></section>
  <section class="card">
    <form id="commentForm" class="form">
      <div class="field"><label for="commentName">Nombre</label><input id="commentName" maxlength="40" autocomplete="name" placeholder="Tu nombre" required></div>
      <div class="field"><label for="commentText">Comentario</label><textarea id="commentText" maxlength="500" placeholder="Escribe un comentario..." required></textarea></div>
      <button type="submit"><i class="fas fa-paper-plane"></i> Publicar</button>
    </form>
    <div id="commentStatus" class="status" aria-live="polite"></div>
  </section>
  <section class="card"><div id="commentsList" class="comments"><div class="empty">Cargando comentarios...</div></div></section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const form=document.getElementById('commentForm');
const nameInput=document.getElementById('commentName');
const textInput=document.getElementById('commentText');
const list=document.getElementById('commentsList');
const status=document.getElementById('commentStatus');
function renderComments(comments=[]){
  list.innerHTML='';
  if(!comments.length){list.innerHTML='<div class="empty">Todavía no hay comentarios. Sé el primero en participar.</div>';return;}
  comments.forEach(comment=>{
    const card=document.createElement('article');card.className='comment';
    const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(comment.name||'?').trim().charAt(0).toUpperCase();
    const body=document.createElement('div');body.className='body';
    const meta=document.createElement('div');meta.className='meta';
    const name=document.createElement('strong');name.textContent=comment.name||'Usuario';
    const time=document.createElement('time');time.textContent=comment.createdAt?new Date(comment.createdAt).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}):'';
    meta.append(name,time);const text=document.createElement('p');text.textContent=comment.text||'';body.append(meta,text);card.append(avatar,body);list.appendChild(card);
  });
}
form.addEventListener('submit',event=>{event.preventDefault();const name=nameInput.value.trim(),text=textInput.value.trim();if(name.length<2||text.length<2){status.textContent='Escribe un nombre y un comentario válido.';return;}const button=form.querySelector('button');button.disabled=true;status.textContent='Publicando...';socket.emit('add-comment',{name,text});});
socket.on('comments',renderComments);
socket.on('comment-status',result=>{const button=form.querySelector('button');button.disabled=false;status.textContent=result?.message||'';if(result?.ok)form.reset();});
</script>
</body>
</html>
